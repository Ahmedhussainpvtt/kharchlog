<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment status — Kharch Log</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="https://kharchlog.com/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="https://kharchlog.com/apple-touch-icon.png" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand-lockup" href="/staging/" aria-label="Kharch Log home">
        <img src="https://kharchlog.com/logo.png" alt="" />
        <span class="brand-lockup__name">Kharch Log</span>
      </a>
            <nav class="site-nav" aria-label="Primary">
        <a href="/features/">Features</a>
        <a href="/staging/pricing/">Pricing</a>
        <a href="/staging/contact/">Contact</a>
        <div class="nav-dropdown">
          <a href="/blog/" class="nav-dropdown__trigger" aria-haspopup="true">Resources</a>
          <div class="nav-dropdown__menu" role="menu">
            <a href="/blog/" role="menuitem">Blog</a>
            <a href="/install/" role="menuitem">Install</a>
            <a href="/staging/faq/" role="menuitem">FAQ</a>
            <a href="/staging/about/" role="menuitem">About</a>
            <a href="/glossary/" role="menuitem">Glossary</a>
            <a href="/staging/refund/" role="menuitem">Refunds</a>
            <a href="https://easypeeze.com/privacy/" role="menuitem">Privacy</a>
            <a href="https://easypeeze.com/terms/" role="menuitem">Terms</a>
          </div>
        </div>
        <a class="nav-cta" href="/staging/pay/">Get lifetime — ₹149</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <section class="hero pay-hero">
        <h1 id="title">Confirming payment…</h1>
        <p class="hero-tagline" id="tagline">Please wait a moment.</p>
      </section>

      <div class="card pay-card">
        <p class="pay-status" id="status" aria-live="polite">Checking…</p>
        <p class="pay-fine" id="detail"></p>
        <p class="pay-fine"><a href="/staging/pay/">← Back to pay</a> · <a href="/staging/">Home</a></p>
      </div>
    </div>
  </main>

  <script src="./config.js"></script>
  <script>
    (function () {
      var cfg = window.KHARCHLOG_PAY || {};
      var params = new URLSearchParams(window.location.search);
      var email = (params.get('email') || '').trim().toLowerCase();
      var phone = (params.get('phone') || '').trim();
      var firstName = (params.get('firstName') || '').trim();
      var lastName = (params.get('lastName') || '').trim();
      var paymentId = (params.get('payment_id') || params.get('paymentId') || '').trim();
      var orderId = (params.get('order_id') || params.get('orderId') || '').trim();
      var signature = (params.get('signature') || '').trim();
      var provider = (params.get('provider') || '').trim().toLowerCase();
      var msg = (params.get('msg') || '').trim();

      var titleEl = document.getElementById('title');
      var tagEl = document.getElementById('tagline');
      var statusEl = document.getElementById('status');
      var detailEl = document.getElementById('detail');

      function fail(text) {
        titleEl.textContent = 'Payment not confirmed';
        tagEl.textContent = 'Staging test — no license is ever granted here.';
        statusEl.textContent = text || 'Verification failed';
        statusEl.className = 'pay-status pay-status-error';
        var parts = [];
        if (paymentId) parts.push('Payment: ' + paymentId);
        if (orderId) parts.push('Order: ' + orderId);
        detailEl.textContent = parts.join(' · ');
      }

      function done(extra) {
        titleEl.textContent = 'Payment completed';
        tagEl.textContent = 'Staging only — license was NOT granted.';
        statusEl.textContent =
          extra ||
          msg ||
          'Payment completed for ' +
            (email || 'your test email') +
            '. This did not unlock the app.';
        statusEl.className = 'pay-status';
        var parts = [];
        if (paymentId) parts.push('Payment: ' + paymentId);
        if (orderId) parts.push('Order: ' + orderId);
        detailEl.textContent = parts.join(' · ');
      }

      function apiBase() {
        return (cfg.trackerUrl || '').replace(/\/$/, '');
      }

      if (!firstName) {
        try { firstName = (sessionStorage.getItem('kharchlog_pay_firstName') || '').trim(); } catch (e) {}
      }
      if (!lastName) {
        try { lastName = (sessionStorage.getItem('kharchlog_pay_lastName') || '').trim(); } catch (e) {}
      }
      if (!email) {
        try {
          email = (sessionStorage.getItem('kharchlog_pay_email') || '').trim().toLowerCase();
        } catch (e) {}
      }
      if (!phone) {
        try {
          phone = (sessionStorage.getItem('kharchlog_pay_phone') || '').trim();
        } catch (e) {}
      }

      if (!cfg.trackerUrl) {
        fail('Missing trackerUrl in pay/config.js');
        return;
      }

      // PayPal already captured with staging:true (no grant)
      if (provider === 'paypal' && (paymentId || orderId)) {
        done();
        return;
      }

      if (!paymentId) {
        fail('Complete payment from the staging pay page first.');
        return;
      }

      fetch(apiBase() + '/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'markPaid',
          staging: true,
          email: email,
          phone: phone,
          firstName: firstName,
          lastName: lastName,
          name: [firstName, lastName].filter(Boolean).join(' '),
          paymentId: paymentId,
          orderId: orderId,
          signature: signature,
          product: 'kharchlog',
          planType: 'lifetime'
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (result) {
          if (!result || !result.ok) {
            throw new Error((result && result.error) || 'Payment not confirmed on server');
          }
          done(result.message);
        })
        .catch(function (e) {
          var text = (e && e.message) || 'Verification failed';
          if (text === 'Failed to fetch' || text === 'Load failed') {
            text = 'Could not reach payment server — retry in a minute.';
          }
          fail(text);
        });
    })();
  </script>
  <script src="../site-motion.js" defer></script>
</body>
</html>
