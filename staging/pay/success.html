<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staging payment status — Kharch Log</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/logo.png" />
  <style>
    .staging-banner {
      background: #C2410C;
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 16px;
    }
  </style>
</head>
<body>
  <div class="staging-banner" role="status">STAGING — test payment result</div>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand-lockup" href="/staging/" aria-label="Kharch Log staging">
        <img src="/logo.png" alt="" width="40" height="40" />
        <span class="brand-lockup__name">Kharch Log</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="/">Production site</a>
        <a href="/staging/pay/">Test pay again</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <div class="wrap">
      <section class="hero pay-hero">
        <h1 id="title">Confirming payment…</h1>
        <p class="hero-tagline" id="tagline">Please wait a moment.</p>
      </section>

      <div class="card pay-card">
        <p class="pay-status" id="status" aria-live="polite">Checking…</p>
        <p class="pay-fine" id="detail"></p>
        <p class="pay-fine"><a href="/staging/pay/">← Test pay again</a> · <a href="/staging/">Staging home</a></p>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var paid = params.get('paid') === '1';
      var email = (params.get('email') || '').trim();
      var orderId = params.get('order_id') || params.get('orderId') || '';

      var titleEl = document.getElementById('title');
      var tagEl = document.getElementById('tagline');
      var statusEl = document.getElementById('status');
      var detailEl = document.getElementById('detail');

      if (paid && email) {
        titleEl.textContent = 'Test payment OK';
        tagEl.textContent = 'Staging license marked paid (test Firestore collection).';
        statusEl.textContent = 'Test unlock for ' + email + '. Production app still uses production API.';
        statusEl.className = 'pay-status';
        detailEl.textContent = orderId ? 'Order: ' + orderId : '';
        try {
          sessionStorage.removeItem('kharchlog_staging_pay_email');
        } catch (e) {}
        return;
      }

      titleEl.textContent = 'No payment confirmed';
      tagEl.textContent = 'Complete checkout from the staging pay page.';
      statusEl.textContent = 'Missing paid=1 redirect — start from /staging/pay/';
      statusEl.className = 'pay-status pay-status-error';
    })();
  </script>
</body>
</html>
