<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staging — Kharch Log</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="/logo.png" />
  <style>
    .staging-banner {
      background: #C2410C;
      color: #fff;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 10px 16px;
    }
    .staging-links {
      display: grid;
      gap: 12px;
      max-width: 420px;
      margin: 24px auto 0;
    }
    .staging-links a {
      display: block;
      padding: 16px 18px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="staging-banner" role="status">STAGING ENVIRONMENT — not indexed, not for customers</div>
  <main id="main" class="section" style="width:min(var(--max), calc(100% - 40px));margin:48px auto;">
    <h1>Kharch Log staging</h1>
    <p style="color:var(--muted);max-width:40rem;">
      Test Razorpay checkout against the staging license API. Test payments write to
      <code>users_staging</code> — production <a href="/">kharchlog.in</a> and the Android app are unchanged.
    </p>
    <div class="staging-links">
      <a href="/staging/pay/">Razorpay test checkout →</a>
      <a href="/">Production website →</a>
    </div>
  </main>
</body>
</html>
